name: Build
on:
  push:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: npm ci
    - run: npm run lint

  validate-pr-to-main:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check component-models.json for non-production URLs
      run: |
        PROD_URL="https://main--gens-prod--vertisdigital.aem.page/tools/assets-selector/config.json"
        
        if grep '"configUrl":' component-models.json | grep -v "$PROD_URL"; then
          echo "::error::PR targeting 'main' contains NON-PRODUCTION URLs in component-models.json! Please use a 'release-*' branch before merging to main."
          exit 1
        fi

  update-environment-configs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Set environment variables & Update URLs
      run: |
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        
        # Skip modifying files on main branch
        if [ "$BRANCH_NAME" == "main" ]; then
          echo "Main branch detected: skipping environment config updates."
          exit 0
        fi
        
        # Determine URLs based on branch
        if [ "$BRANCH_NAME" == "uat" ]; then
          CONFIG_URL="https://uat--gens-stage--vertisdigital.aem.page/tools/assets-selector/config.json"
        elif [[ "$BRANCH_NAME" == release-* ]]; then
          CONFIG_URL="https://main--gens-prod--vertisdigital.aem.page/tools/assets-selector/config.json"
        else
          CONFIG_URL="https://dev--gens--vertisdigital.aem.page/tools/assets-selector/config.json"
        fi
        
        # Update component-models.json
        sed -i "s|\"configUrl\": \".*\"|\"configUrl\": \"${CONFIG_URL}\"|" component-models.json

    - name: Commit changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        HAS_CHANGES=false
        
        if [[ -n "$(git status --porcelain component-models.json)" ]]; then
          git add component-models.json
          HAS_CHANGES=true
        fi

        if [ "$HAS_CHANGES" = true ]; then
          echo "Changes detected, committing..."
          git commit -m "Update environment configurations for ${{ github.ref_name }} branch"
          
          # Pull latest changes to avoid conflicts in case someone pushed concurrently
          git pull --rebase origin ${{ github.ref_name }} || true
          
          git push
        else
          echo "No changes detected, skipping commit"
        fi
